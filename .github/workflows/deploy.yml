name: Build & Deploy

# Lightweight pipeline: tier-quota check + unit tests, publish, deploy to App Service, smoke.
# The Integration / E2E suites run locally. If a deploy issue arises, prefer trimming this file
# further over adding functionality.

on:
  push:
    branches: [master]
    # A docs-only or infra-only push must not recycle the live App Service and burn a smoke run.
    # The failure this workflow guards against is /health never returning 200, which a typo in a
    # markdown file cannot cause. SCRIPTS/** is deliberately NOT ignored — the smoke job executes
    # post-deploy-smoke.mjs, so a change there does want a run.
    paths-ignore:
      - '**.md'
      - 'infra/**'
  # Pull requests (Dependabot's too) get the build and tests; only a push to master deploys.
  pull_request:
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
  AZURE_RESOURCE_GROUP: PoSeeReview
  API_PROJECT_PATH: src/PoSeeReview.Api/PoSeeReview.Api.csproj

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      # Tier quotas (NET_RULES 5.1: Unit 100 / Integration 50 / E2EAPI 25 / E2EUI 25).
      # Published first so a suite that quietly grew past its cap fails the run before the
      # three-minute publish. `dotnet publish` cannot catch this — it never reads tests/.
      - name: Check test tier quotas
        run: node SCRIPTS/check-test-quota.mjs
      - name: Run unit tests
        run: dotnet test tests/PoSeeReview.Unit -c Release
      - run: dotnet publish ${{ env.API_PROJECT_PATH }} -c Release -o publish
      - uses: actions/upload-artifact@v7
        with:
          name: webapp
          path: publish
          retention-days: 1

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 20
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: webapp
          path: publish
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Same step in every Po web repo. F1 gives the app about 60 CPU-minutes a day; once spent, Azure stops the
      # site (usageState Exceeded) until 00:00 UTC and refuses the package with a bare 403. Say what it is.
      - name: Check the F1 daily CPU quota
        run: |
          usage=$(az webapp show -g "${{ github.event.repository.name }}" -n "${{ vars.AZURE_WEBAPP_NAME }}" --query usageState -o tsv)
          if [ "$usage" = "Exceeded" ]; then
            echo "::error::${{ vars.AZURE_WEBAPP_NAME }} has used up its F1 daily CPU quota, so Azure refuses the package until 00:00 UTC. Rerun after that."
            exit 1
          fi

      # Same pair in every Po web repo: keep the live build, and put it back if anything fails once the
      # new package is live (see "Roll back to the previous build" at the end of this job).
      - name: Back up the live site
        id: backup
        run: |
          token=$(az account get-access-token --query accessToken -o tsv)
          if curl -fsS --max-time 300 -H "Authorization: Bearer $token" -o previous.zip \
               "https://${{ vars.AZURE_WEBAPP_NAME }}.scm.azurewebsites.net/api/zip/site/wwwroot/" && [ -s previous.zip ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Backed up $(du -h previous.zip | cut -f1) of the live site."
          else
            echo "::warning title=No backup::Could not download the live site, so this deploy cannot be rolled back."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # The startup command (two runtimeconfig.json files defeat auto-detection) is pinned by
      # appCommandLine in infra/modules/appservice.bicep, and a site setting survives deploys.
      - uses: azure/webapps-deploy@v3
        id: deploy
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ env.AZURE_RESOURCE_GROUP }}
          package: publish

      # Same gate in every Po web repo: the new build is the one answering (X-Commit on /health/live is this
      # commit, not the old instance still serving), then its dependencies answer (/health).
      - name: Health gate (this commit on /health/live, then /health)
        shell: bash
        run: |
          base="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          for attempt in $(seq 1 60); do
            commit=$(curl -s -D - -o /dev/null --max-time 30 "$base/health/live" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-commit" {print $2}' || true)
            [ "$commit" = "$GITHUB_SHA" ] && { echo "/health/live serves $GITHUB_SHA (attempt $attempt)"; break; }
            [ "$attempt" = "60" ] && { echo "::error::/health/live still serves ${commit:-no X-Commit header}, not $GITHUB_SHA"; exit 1; }
            sleep 15
          done
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$base/health" || echo 000)
            [ "$code" = "200" ] && { echo "/health -> 200 (attempt $attempt)"; exit 0; }
            sleep 15
          done
          echo "::error::/health never returned 200 (last: $code)"; exit 1

      - name: Roll back to the previous build
        if: failure() && steps.deploy.outcome == 'success' && steps.backup.outputs.ok == 'true'
        run: |
          az webapp deploy -g "${{ github.event.repository.name }}" -n "${{ vars.AZURE_WEBAPP_NAME }}" \
            --src-path previous.zip --type zip --clean true
          echo "::error title=Rolled back::${{ github.sha }} failed after it went live; the previous build is live again."

  smoke:
    name: Post-deploy smoke
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10
    env:
      BASE_URL: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # App Service needs a moment to recycle after a package swap; poll /health rather
      # than sleeping a fixed amount so a fast deploy is not penalised.
      - name: Wait for the app to come back up
        run: |
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/health" || echo 000)
            echo "attempt $attempt: /health -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::/health never returned 200 after the deploy"
          exit 1

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.49.0
          npx playwright install --with-deps chromium

      # NET_RULES 5.4: Blazor render tree init, /health, and masked config from /diag.
      - name: Run smoke checks
        run: node SCRIPTS/post-deploy-smoke.mjs

      # Budgets that fail the run: layout shift (the boot splash once cost 0.20 CLS on every
      # load) and the accessibility score. Performance and LCP only warn: an F1 cold start and a
      # WASM boot under mobile throttling swing them run to run (LCP 3.2s to 19s on one deploy).
      # /login because it is the one page an anonymous run can render. Reports stay with the run.
      - name: Lighthouse budgets
        run: npx --yes @lhci/cli@0.15.1 autorun --config=SCRIPTS/lighthouserc.json --collect.url="$BASE_URL/login"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 7
