name: Build & Deploy

# Lightweight pipeline: tier-quota check + unit tests, publish, deploy to App Service, smoke.
# The Integration / E2E suites run locally. If a deploy issue arises, prefer trimming this file
# further over adding functionality.

on:
  push:
    branches: [master]
    # A docs-only or infra-only push must not recycle the live App Service and burn a smoke run.
    # The failure this workflow guards against is /health never returning 200, which a typo in a
    # markdown file cannot cause. SCRIPTS/** is deliberately NOT ignored — the smoke job executes
    # post-deploy-smoke.mjs, so a change there does want a run.
    paths-ignore:
      - '**.md'
      - 'infra/**'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
  AZURE_RESOURCE_GROUP: PoSeeReview
  API_PROJECT_PATH: src/PoSeeReview.Api/PoSeeReview.Api.csproj

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      # Tier quotas (NET_RULES 5.1: Unit 100 / Integration 50 / E2EAPI 25 / E2EUI 25).
      # Published first so a suite that quietly grew past its cap fails the run before the
      # three-minute publish. `dotnet publish` cannot catch this — it never reads tests/.
      - name: Check test tier quotas
        run: node SCRIPTS/check-test-quota.mjs
      - name: Run unit tests
        run: dotnet test tests/PoSeeReview.Unit -c Release
      - run: dotnet publish ${{ env.API_PROJECT_PATH }} -c Release -o publish
      - uses: actions/upload-artifact@v7
        with:
          name: webapp
          path: publish
          retention-days: 1

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 20
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: webapp
          path: publish
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # The startup command (two runtimeconfig.json files defeat auto-detection) is pinned by
      # appCommandLine in infra/modules/appservice.bicep, and a site setting survives deploys.
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ env.AZURE_RESOURCE_GROUP }}
          package: publish

      # Same gate in every Po web repo: the process is up (/health/live) and its dependencies answer (/health).
      - name: Health gate (/health/live, /health)
        shell: bash
        run: |
          base="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          for path in /health/live /health; do
            for attempt in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$base$path" || echo 000)
              [ "$code" = "200" ] && { echo "$path -> 200 (attempt $attempt)"; break; }
              [ "$attempt" = "60" ] && { echo "::error::$path never returned 200 (last: $code)"; exit 1; }
              sleep 15
            done
          done

  smoke:
    name: Post-deploy smoke
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10
    env:
      BASE_URL: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # App Service needs a moment to recycle after a package swap; poll /health rather
      # than sleeping a fixed amount so a fast deploy is not penalised.
      - name: Wait for the app to come back up
        run: |
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/health" || echo 000)
            echo "attempt $attempt: /health -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::/health never returned 200 after the deploy"
          exit 1

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.49.0
          npx playwright install --with-deps chromium

      # NET_RULES 5.4: Blazor render tree init, /health, and masked config from /diag.
      - name: Run smoke checks
        run: node SCRIPTS/post-deploy-smoke.mjs

      # Budgets that fail the run: layout shift (the boot splash once cost 0.20 CLS on every
      # load) and the accessibility score. Performance and LCP only warn: an F1 cold start and a
      # WASM boot under mobile throttling swing them run to run (LCP 3.2s to 19s on one deploy).
      # /login because it is the one page an anonymous run can render. Reports stay with the run.
      - name: Lighthouse budgets
        run: npx --yes @lhci/cli@0.15.1 autorun --config=SCRIPTS/lighthouserc.json --collect.url="$BASE_URL/login"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 7
