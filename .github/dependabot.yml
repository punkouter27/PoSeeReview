# Keeps the NuGet packages (all named in Directory.Packages.props) and the pinned GitHub Actions in the workflows up to date.
# One pull request a week for each, with the small updates grouped, so they are easy to review together.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Microsoft.AspNetCore.OpenApi 10 needs Microsoft.OpenApi 2.x; 3.x fails restore (NU1608). Lift with .NET 11.
      - dependency-name: Microsoft.OpenApi
        update-types: ["version-update:semver-major"]
      # 3.x is the OpenTelemetry rewrite: Serilog.Sinks.ApplicationInsights 5 needs < 3.0 (NU1608) and
      # ITelemetryInitializer is gone. A migration, not a bump.
      - dependency-name: Microsoft.ApplicationInsights*
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
